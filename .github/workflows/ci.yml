name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: case_user
          POSTGRES_PASSWORD: case_password
          POSTGRES_DB: case_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U case_user -d case_tracking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://case_user:case_password@localhost:5432/case_tracking_test