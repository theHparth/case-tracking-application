services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case_password
      POSTGRES_DB: case_tracking
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_user -d case_tracking"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://case_user:case_password@db:5432/case_tracking
    ports:
      - "8001:8000"

volumes:
  db_data:
