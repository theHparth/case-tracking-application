<h2>Cases</h2>

<p *ngIf="error">{{ error }}</p>

<table *ngIf="cases.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Status</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of cases">
      <td>{{ c.id }}</td>
      <td>{{ c.title }}</td>
      <td>{{ c.status }}</td>
      <td>{{ c.created_at }}</td>
    </tr>
  </tbody>
</table>

<p *ngIf="cases.length === 0 && !error">No cases found.</p>
